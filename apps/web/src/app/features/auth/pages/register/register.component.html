<div class="page">
  <main class="card" role="main" aria-label="Register">
    <header class="header">
      <h1 class="brand">QuickFood</h1>
      <p class="subtitle">Registriere dich als Customer oder Owner.</p>
    </header>

    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label class="label" for="username">Username</label>
        <input
          id="username"
          class="input"
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="z. B. max"
        />
        <p class="hint error" *ngIf="form.controls.username.touched && form.controls.username.invalid">
          Username ist erforderlich.
        </p>
      </div>

      <div class="field">
        <label class="label" for="password">Passwort</label>
        <input
          id="password"
          class="input"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="mind. 6 Zeichen"
        />
        <p class="hint error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Passwort ist erforderlich (min. 6 Zeichen).
        </p>
      </div>

      <div class="field">
        <label class="label" for="role">Rolle</label>
        <select id="role" class="input" formControlName="role">
          <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
        </select>
        <p class="hint">Du kannst dich nur als Customer oder Owner registrieren.</p>
      </div>

      <div class="alert" role="alert" *ngIf="errorMessage">
        <strong>Registrierung fehlgeschlagen.</strong>
        <span>{{ errorMessage }}</span>
      </div>

      <button class="btn primary" type="submit" [disabled]="isSubmitting || form.invalid">
        <span *ngIf="!isSubmitting">Registrieren</span>
        <span *ngIf="isSubmitting">Registrieren…</span>
      </button>

      <p class="switch">
        Schon registriert?
        <a routerLink="/login">Zum Login</a>
      </p>
    </form>
  </main>
</div>

<section class="owner-restaurant-list">
  <header>
    <h1>My Restaurants</h1>
    <p>Create and manage your restaurants.</p>
    <p *ngIf="!isLoading">Showing {{ restaurants.length }} restaurants</p>
  </header>

  <div class="status" *ngIf="isLoading">Loading...</div>
  <div class="status error" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="status" *ngIf="!isLoading && !errorMessage && restaurants.length === 0">
    No restaurants found yet.
  </div>

  <div class="content">
    <div class="list">
      <div class="card" *ngFor="let restaurant of restaurants; trackBy: trackByRestaurantId">
        <div>
          <h3>{{ restaurant.name }}</h3>
          <p>Status: {{ restaurant.status }}</p>
          <p *ngIf="restaurant.category">Category: {{ restaurant.category }}</p>
        </div>
        <a [routerLink]="['/owner/restaurants', restaurant.id]">Manage</a>
      </div>
    </div>

    <div class="form">
      <h2>Create Restaurant</h2>
      <app-owner-restaurant-form
        submitLabel="Create"
        (submitForm)="createRestaurant($event)"
      ></app-owner-restaurant-form>
    </div>
  </div>
</section>
